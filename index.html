<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AXXIN CLAN ANWESENHEIT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  h1 {
    color: #d4af37;
    padding: 18px 0 10px;
    font-size: 1.5rem;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #d4af3755;
  }

  .top-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  button {
    background: #2a2a2a;
    color: #d4af37;
    border: 1px solid #d4af37;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 0.85rem;
    transition: background 0.15s;
  }
  button:hover { background: #3a3a2a; }

  #users-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    padding: 10px 16px;
  }

  .name-section {
    background: #252525;
    border: 2px solid #d4af37;
    border-radius: 10px;
    padding: 12px 10px;
    position: relative;
    transition: border-color 0.2s;
  }
  .name-section.warn   { border-color: orange; }
  .name-section.danger { border-color: red; background: #2e1a1a; }

  .name-section h2 {
    color: #d4af37;
    font-size: 0.95rem;
    margin-bottom: 6px;
    word-break: break-all;
    cursor: default;
  }
  .edit-mode .name-section h2 { cursor: pointer; text-decoration: underline dashed; }

  .absent-info { color: #ccc; font-size: 0.82rem; margin-bottom: 6px; }

  .absent-btns { display: flex; gap: 5px; justify-content: center; margin-bottom: 8px; }
  .absent-btns button { padding: 4px 10px; font-size: 0.8rem; }

  .row-label { color: #999; font-size: 0.75rem; margin-bottom: 2px; }

  .toggle-btn {
    background: #333;
    color: #aaa;
    border: 1px solid #555;
    width: 36px; height: 28px;
    border-radius: 4px;
    margin: 0 auto 8px;
    display: block;
    font-size: 1rem;
    transition: background 0.15s, color 0.15s;
  }
  .toggle-btn.active { background: #1e6e1e; color: #fff; border-color: #2ecc71; }

  .delete-btn {
    position: absolute;
    top: 5px; right: 5px;
    background: #700;
    color: white;
    border: none;
    border-radius: 4px;
    width: 22px; height: 22px;
    font-size: 0.75rem;
    display: none;
    padding: 0;
  }
  .edit-mode .delete-btn { display: block; }

  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #111;
    border-top: 1px solid #d4af3744;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 10px;
    z-index: 100;
  }
</style>
</head>
<body>

<h1>⚔️ AXXIN CLAN ANWESENHEIT</h1>

<div class="top-bar">
  <input type="text" id="searchInput" placeholder="Person suchen..." style="padding: 6px 12px; background: #2a2a2a; color: #d4af37; border: 1px solid #d4af37; border-radius: 5px; font-size: 0.85rem;" onkeyup="updateSearch()">
  <button onclick="resetAll()">Reset Alles</button>
  <button onclick="resetPresent()">Reset Anwesend</button>
</div>

<div id="users-container"></div>

<div class="bottom-bar">
  <button onclick="toggleEdit()" id="editBtn">✏️ Bearbeiten</button>
  <button onclick="setFilter('all')" id="f-all">Alle</button>
  <button onclick="setFilter('warn')" id="f-warn">⚠️ 2/3</button>
  <button onclick="setFilter('danger')" id="f-danger">🚫 3/3</button>
  <button onclick="markUnaffectedAbsent()" id="markUnaffectedBtn" style="display:none">Nicht betroffene +1 Abw.</button>
  <button onclick="saveToServer()" id="localSaveBtn" style="display:none">💾 Lokal speichern</button>
  <button onclick="addUser()" id="addBtn" style="display:none">➕</button>
</div>

<script>

let filter = "all";
let searchFilter = "";
let users = [];

  users.forEach(u => u.__edited = false);
}

async function loadUsers() {
  try {
    const response = await fetch('users.json', { cache: 'no-store' });
    if (response.ok) {
      users = await response.json();
    } else {
      users = JSON.parse(JSON.stringify(defaultUsers));
    }
  } catch (error) {
    users = JSON.parse(JSON.stringify(defaultUsers));
  }
  users.forEach(u => u.__edited = false);
  sortUsers();
  render();
}

async function saveToServer() {
  const secret = prompt('Server-Secret (falls konfiguriert), leer lassen sonst:');
  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, secret ? { 'X-Secret': secret } : {}),
      body: JSON.stringify(users)
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt || res.statusText);
    }
    alert('Erfolgreich lokal gespeichert (users.json aktualisiert).');
  } catch (e) {
    alert('Speichern auf Server fehlgeschlagen: ' + e.message);
  }
}

const container = document.getElementById("users-container");

function sortUsers() {
  users.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase(), 'de'));
}

function render() {
  container.innerHTML = "";
  let filtered = users;
  if (filter === "warn")   filtered = users.filter(u => u.absent == 2);
  if (filter === "danger") filtered = users.filter(u => u.absent == 3);
  
  if (searchFilter) {
    filtered = filtered.filter(u => u.name.toLowerCase().includes(searchFilter.toLowerCase()));
  }

  filtered.forEach(u => {
    let index = users.indexOf(u);
    let cls = u.absent == 2 ? "warn" : u.absent == 3 ? "danger" : "";
    let sym = u.absent == 2 ? "⚠️" : u.absent == 3 ? "🚫" : "";

    let div = document.createElement("div");
    div.className = "name-section " + cls;
    const nameAction = editMode ? `onclick="editName(${index})"` : "";
    const deleteBtn = editMode ? `<button class="delete-btn" onclick="deleteUser(${index})">✕</button>` : "";
    const absentButtons = editMode
      ? `<div class="absent-btns">
          <button onclick="inc(${index})">+ Abwesend</button>
          <button onclick="dec(${index})">−</button>
        </div>`
      : "";
    const presentControl = editMode
      ? `<button class="toggle-btn ${u.present ? 'active' : ''}" onclick="togglePresent(${index})">✔</button>`
      : `<button class="toggle-btn ${u.present ? 'active' : ''}" disabled>✔</button>`;
    const excuseControl = editMode
      ? `<button class="toggle-btn ${u.excuse ? 'active' : ''}" onclick="toggleExcuse(${index})">✔</button>`
      : `<button class="toggle-btn ${u.excuse ? 'active' : ''}" disabled>✔</button>`;

    div.innerHTML = `
      ${deleteBtn}
      <h2 ${nameAction}>${u.name}</h2>
      <div class="absent-info">Abwesend: ${u.absent} / 3 ${sym}</div>
      ${absentButtons}
      <div class="row-label">Anwesend</div>
      ${presentControl}
      <div class="row-label">Entschuldigt</div>
      ${excuseControl}
    `;
    container.appendChild(div);
  });
}

function setFilter(f) {
  filter = f;
  ["all","warn","danger"].forEach(x => document.getElementById("f-"+x).style.background = "");
  document.getElementById("f-"+f).style.background = "#3a3a2a";
  render();
}

function updateSearch() {
  searchFilter = document.getElementById("searchInput").value;
  render();
}

function toggleEdit() {
  editMode = !editMode;
  if (editMode) {
    users.forEach(u => u.__edited = false);
  }
  document.body.classList.toggle("edit-mode", editMode);
  document.getElementById("addBtn").style.display = editMode ? "inline" : "none";
  document.getElementById("localSaveBtn").style.display = editMode ? "inline" : "none";
  document.getElementById("markUnaffectedBtn").style.display = editMode ? "inline" : "none";
  document.getElementById("editBtn").textContent = editMode ? "✏️ Fertig" : "✏️ Bearbeiten";
  document.getElementById("editBtn").style.background = editMode ? "#3a3a2a" : "";
  render();
}

function addUser() {
  let n = prompt("Name:");
  if (!n) return;
  const newUser = {name: n, absent: 0, present: false, excuse: false, __edited: true};
  users.push(newUser);
  sortUsers();
  render();
}

function deleteUser(i) {
  if (!editMode) return;
  if (confirm("Löschen?")) {
    users.splice(i, 1);
    render();
  }
}

function editName(i) {
  if (!editMode) return;
  let n = prompt("Neuer Name:", users[i].name);
  if (n) {
    users[i].name = n;
    users[i].__edited = true;
    sortUsers();
    render();
  }
}

function markUnaffectedAbsent() {
  if (!editMode) return;
  if (!confirm("Allen nicht bearbeiteten Personen (außer Entschuldigte) +1 Abwesenheit geben?")) return;
  users.forEach(u => {
    if (!u.__edited && !u.excuse && u.absent < 3) {
      u.present = false;
      u.absent++;
    }
  });
  render();
}

function inc(i) {
  if (!editMode) return;
  if (users[i].absent < 3) {
    users[i].absent++;
    users[i].__edited = true;
  }
  render();
}

function dec(i) {
  if (!editMode) return;
  if (users[i].absent > 0) {
    users[i].absent--;
    users[i].__edited = true;
  }
  render();
}

function togglePresent(i) {
  if (!editMode) return;
  users[i].present = !users[i].present;
  if (users[i].present) users[i].absent = 0;
  users[i].__edited = true;
  render();
}

function toggleExcuse(i) {
  if (!editMode) return;
  users[i].excuse = !users[i].excuse;
  users[i].__edited = true;
  render();
}

function resetAll() {
  if (confirm("Alles zurücksetzen?")) {
    users.forEach(u => { u.absent = 0; u.present = false; u.excuse = false; });
    render();
  }
}

function resetPresent() {
  users.forEach(u => u.present = false);
  render();
}

document.getElementById("f-all").style.background = "#3a3a2a";
loadUsers();
</script>
</body>
</html>
